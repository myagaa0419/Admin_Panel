<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Нэвтрэх | ЮН самбар</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='yun-logo.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="login-layout">
    <section class="login-card">
      <img class="login-logo" src="{{ url_for('static', filename='yun-logo.svg') }}" alt="ЮН брэндийн лого">
      <p class="eyebrow">ЗАХИРГААНЫ САМБАР</p>
      <h1>Тавтай морил</h1>
      <p class="muted">Самбарт нэвтрэхийн тулд мэдээллээ оруулна уу.</p>

      {% for category, message in get_flashed_messages(with_categories=true) %}
        <p class="notice {{ category }}" role="alert">{{ message }}</p>
      {% endfor %}

      <form method="post">
        <label for="email">Цахим шуудан</label>
        <input id="email" name="email" type="email" autocomplete="username"
               placeholder="Цахим шуудангийн хаягаа бичнэ үү" value="{{ request.form.get('email', '') }}" required>

        <label for="password">Нууц үг</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" placeholder="Нууц үгээ оруулна уу" required>

        <button type="submit">Нэвтрэх <span aria-hidden="true">→</span></button>
      </form>
      <p class="secure-note">Таны мэдээллийг нууцлан шалгана.</p>
    </section>
  </main>
</body>
</html>
